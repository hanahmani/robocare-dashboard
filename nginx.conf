server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy des appels API vers le backend Spring Boot ──────────────
    # En Docker, le backend est joignable via le nom du service docker-compose.
    location /api/ {
        proxy_pass http://robocare-notification:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook {
        proxy_pass http://robocare-notification:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA : toutes les autres routes renvoient index.html ───────────
    # (nécessaire pour react-router : /login, /history, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
